# PKR 后端服务编排
# 用法：
#   docker compose up -d --build          # 启动（首次会下载 BGE-M3 模型）
#   docker compose logs -f backend        # 查看日志
#   docker compose down                   # 停止
services:
  backend:
    build:
      context: ./backend
    container_name: pkr-backend
    ports:
      - "8000:8000"
    environment:
      # 在 .env 文件中配置，或直接在此处填写
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - EMBEDDING_DEVICE=${EMBEDDING_DEVICE:-cpu}
    volumes:
      # SQLite + ChromaDB + uploads 持久化
      - ./backend/data:/app/data
      # HuggingFace 模型缓存（宿主机已有 BGE-M3 缓存时直接复用，避免重复下载）
      - ${HF_CACHE_DIR:-./.hf_cache}:/root/.cache/huggingface
    restart: unless-stopped
